name: renderer bake-off

on:
  pull_request:
    paths:
      - 'experiments/renderers/svg-bakeoff/**'
      - 'packages/model/**'
      - 'packages/kinematics/**'
      - 'packages/scene/**'
      - 'packages/renderer-svg/**'
      - 'package.json'
      - '.github/workflows/renderer-bakeoff.yml'

permissions:
  contents: write
  pull-requests: write

jobs:
  browser-scorecard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Typecheck, unit tests and production build
        id: compile
        shell: bash
        run: |
          set +e
          npm run check > /tmp/renderer-check.log 2>&1
          code=$?
          cat /tmp/renderer-check.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publish compile diagnostics
        if: steps.compile.outputs.exit_code != '0'
        uses: actions/github-script@v7
        env:
          CHECK_LOG: /tmp/renderer-check.log
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- atlas-renderer-compile -->';
            const log = fs.readFileSync(process.env.CHECK_LOG, 'utf8').slice(-12000);
            const body = `${marker}\n## Renderer bake-off compile diagnostics\n\n\`\`\`text\n${log}\n\`\`\``;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const existing = comments.find(comment => comment.user?.type === 'Bot' && comment.body?.includes(marker));
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
      - name: Stop after compile failure
        if: steps.compile.outputs.exit_code != '0'
        run: exit 1
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
        working-directory: experiments/renderers/svg-bakeoff
      - name: Browser interaction tests
        run: npm run test:e2e --workspace @atlasmechanica/svg-bakeoff
      - name: Start production preview
        run: |
          npm run preview --workspace @atlasmechanica/svg-bakeoff -- --host 127.0.0.1 --port 4173 > /tmp/renderer-vite.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173 >/dev/null && exit 0; sleep 1; done
          cat /tmp/renderer-vite.log
          exit 1
      - name: Bundle report
        run: node experiments/renderers/svg-bakeoff/scripts/bundle-report.mjs > /tmp/renderer-bundle.json
      - name: Browser benchmark and screenshots
        run: node scripts/browser-report.mjs > /tmp/renderer-browser.json
        working-directory: experiments/renderers/svg-bakeoff
      - name: Upload visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: renderer-bakeoff-evidence
          path: |
            experiments/renderers/svg-bakeoff/renderer-bakeoff-*.png
            experiments/renderers/svg-bakeoff/renderer-browser-report.json
            /tmp/renderer-bundle.json
      - name: Publish scorecard to pull request
        uses: actions/github-script@v7
        env:
          BUNDLE_PATH: /tmp/renderer-bundle.json
          BROWSER_PATH: experiments/renderers/svg-bakeoff/renderer-browser-report.json
        with:
          script: |
            const fs = require('fs');
            const bundle = JSON.parse(fs.readFileSync(process.env.BUNDLE_PATH, 'utf8'));
            const browser = JSON.parse(fs.readFileSync(process.env.BROWSER_PATH, 'utf8'));
            const marker = '<!-- atlas-renderer-bakeoff -->';
            const body = `${marker}\n## Renderer bake-off scorecard\n\n### Bundle\n\`\`\`json\n${JSON.stringify(bundle, null, 2)}\n\`\`\`\n\n### Chromium + WebKit\n\`\`\`json\n${JSON.stringify(browser, null, 2)}\n\`\`\``;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const existing = comments.find(comment => comment.user?.type === 'Bot' && comment.body?.includes(marker));
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
      - name: Stage visual review screenshots
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          mkdir -p /tmp/atlas-visual-review
          cp experiments/renderers/svg-bakeoff/renderer-bakeoff-open-belt-chromium.png /tmp/atlas-visual-review/open-belt-chromium.png
          cp experiments/renderers/svg-bakeoff/renderer-bakeoff-crossed-belt-chromium.png /tmp/atlas-visual-review/crossed-belt-chromium.png
          cp experiments/renderers/svg-bakeoff/renderer-bakeoff-open-belt-webkit.png /tmp/atlas-visual-review/open-belt-webkit.png
          cp experiments/renderers/svg-bakeoff/renderer-bakeoff-crossed-belt-webkit.png /tmp/atlas-visual-review/crossed-belt-webkit.png
      - name: Publish visual review branch
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          REVIEW_BRANCH: visual-review-pr-${{ github.event.pull_request.number }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -rf /tmp/atlas-visual-review-worktree
          git worktree add --detach /tmp/atlas-visual-review-worktree HEAD
          cd /tmp/atlas-visual-review-worktree
          git switch --orphan "$REVIEW_BRANCH"
          git rm -rf .
          cp /tmp/atlas-visual-review/*.png .
          git add *.png
          git commit -m "Visual review for PR #${{ github.event.pull_request.number }}"
          git push --force origin HEAD:"$REVIEW_BRANCH"
      - name: Publish visual review to pull request
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        env:
          REVIEW_BRANCH: visual-review-pr-${{ github.event.pull_request.number }}
        with:
          script: |
            const marker = '<!-- atlas-visual-review -->';
            const { owner, repo } = context.repo;
            const branch = process.env.REVIEW_BRANCH;
            const raw = `https://raw.githubusercontent.com/${owner}/${repo}/${branch}`;
            const body = `${marker}\n## Visual review — approval required before merge\n\n### Brown / 507 movement 1 reference\n![Brown / 507 movement 1](https://507movements.com/img/mm_001.png)\n\n### Atlas open belt — Chromium\n![Atlas open belt Chromium](${raw}/open-belt-chromium.png)\n\n### Atlas crossed belt — Chromium\n![Atlas crossed belt Chromium](${raw}/crossed-belt-chromium.png)\n\n<details><summary>WebKit screenshots</summary>\n\n![Atlas open belt WebKit](${raw}/open-belt-webkit.png)\n\n![Atlas crossed belt WebKit](${raw}/crossed-belt-webkit.png)\n</details>\n\n**Do not merge until the visual review is explicitly approved.**`;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const existing = comments.find(comment => comment.user?.type === 'Bot' && comment.body?.includes(marker));
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
