name: implementation snapshot
on:
  pull_request:
    paths: ['.github/workflows/implementation-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c3eab407a324814ea4be122be06601d397bfe9e4
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global npm@11.6.0 && npm ci
      - name: Package clean source and locked dependencies for offline validation
        run: |
          git archive --format=tar HEAD > /tmp/atlas-source.tar
          tar -czf /tmp/atlas-dependencies.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: implementation-snapshot
          path: /tmp/atlas-*.tar*
          retention-days: 1
