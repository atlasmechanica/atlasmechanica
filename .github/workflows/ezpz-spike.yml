name: ezpz spike

on:
  pull_request:
    paths:
      - 'experiments/solvers/ezpz/**'
      - 'packages/kinematics/src/fourBarConstraintPlan.ts'
      - 'packages/kinematics/src/fourBarConstraintPlan.test.ts'
      - 'packages/kinematics/src/fixtures/fourBarConstraintPlan.json'
      - '.github/workflows/ezpz-spike.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  native-four-bar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test native spike
        run: cargo test --release --manifest-path experiments/solvers/ezpz/Cargo.toml

      - name: Run native benchmark
        run: cargo run --release --quiet --manifest-path experiments/solvers/ezpz/Cargo.toml > /tmp/ezpz-report.json

      - name: Publish benchmark to pull request
        uses: actions/github-script@v7
        env:
          REPORT_PATH: /tmp/ezpz-report.json
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync(process.env.REPORT_PATH, 'utf8');
            const marker = '<!-- atlas-ezpz-spike -->';
            const body = `${marker}\n## ezpz native four-bar spike\n\n\`\`\`json\n${report}\n\`\`\``;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(comment =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
