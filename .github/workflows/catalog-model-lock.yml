name: catalog model workspace lock
on:
  push:
    branches: [feat/json-model-presets]
    paths: [.github/workflows/catalog-model-lock.yml]
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Record the existing model workspace edge and upload immutable lock blob
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          const pkg = JSON.parse(readFileSync('packages/catalog/package.json', 'utf8'));
          if (JSON.stringify(pkg.dependencies) !== JSON.stringify({'@atlasmechanica/model': 'file:../model'})) throw new Error('Unexpected dependencies');
          if (lock.packages['node_modules/@atlasmechanica/model']?.resolved !== 'packages/model') throw new Error('Missing existing model workspace');
          if (lock.packages['packages/catalog'].dependencies !== undefined) throw new Error('Unexpected prior catalog dependencies');
          lock.packages['packages/catalog'].dependencies = pkg.dependencies;
          const content = JSON.stringify(lock, null, 2) + '\n';
          const response = await fetch('https://api.github.com/repos/atlasmechanica/atlasmechanica/git/blobs', {
            method: 'POST',
            headers: {Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json'},
            body: JSON.stringify({content, encoding: 'utf-8'}),
          });
          if (!response.ok) throw new Error(`Upload failed: ${response.status}`);
          console.log(JSON.stringify({path: 'package-lock.json', sha: (await response.json()).sha}));
          NODE
