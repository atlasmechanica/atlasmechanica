name: catalog schema dependency lock
on:
  push:
    branches: [feat/catalog-editor-schema]
    paths: [.github/workflows/catalog-schema-lock.yml]
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global npm@11.6.0
      - run: npm install --package-lock-only --ignore-scripts
      - name: Preserve generated lock as an immutable blob
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const content = readFileSync('package-lock.json', 'utf8');
          const lock = JSON.parse(content);
          const original = JSON.parse(execFileSync('git', ['show', 'HEAD:package-lock.json'], {encoding: 'utf8'}));
          if (lock.packages[''].devDependencies.ajv !== '8.20.0') throw new Error('Unexpected Ajv version');
          for (const [path, entry] of Object.entries(original.packages)) {
            if (path !== '' && JSON.stringify(entry) !== JSON.stringify(lock.packages[path])) throw new Error(`Existing lock entry changed: ${path}`);
          }
          console.log('Added lock entries:', Object.keys(lock.packages).filter(path => !(path in original.packages)).join(', '));
          const response = await fetch('https://api.github.com/repos/atlasmechanica/atlasmechanica/git/blobs', {
            method: 'POST',
            headers: {Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json'},
            body: JSON.stringify({content, encoding: 'utf-8'}),
          });
          if (!response.ok) throw new Error(`Blob creation failed: ${response.status}`);
          console.log(JSON.stringify({path: 'package-lock.json', sha: (await response.json()).sha}));
          NODE
