name: catalog schema dependency lock
on:
  push:
    branches: [feat/catalog-editor-schema]
    paths: [.github/workflows/catalog-schema-lock.yml]
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global npm@11.6.0
      - run: npm install --package-lock-only --ignore-scripts
      - name: Preserve existing resolutions and prepare strict schema artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const generated = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          const lock = JSON.parse(execFileSync('git', ['show', 'HEAD:package-lock.json'], {encoding: 'utf8'}));
          if (generated.packages[''].devDependencies.ajv !== '8.20.0') throw new Error('Unexpected Ajv version');
          // npm reclassifies unrelated optional packages on this runner. Retain
          // their existing entries; adopt only the new validator dependency tree.
          const allowed = new Set(['node_modules/ajv', 'node_modules/fast-deep-equal', 'node_modules/fast-uri', 'node_modules/json-schema-traverse', 'node_modules/require-from-string']);
          for (const [path, entry] of Object.entries(generated.packages)) {
            if (Object.hasOwn(lock.packages, path)) continue;
            if (!allowed.has(path)) throw new Error(`Unexpected added package: ${path}`);
            lock.packages[path] = entry;
            console.log('Added dependency:', path, entry.version);
          }
          if (lock.packages['node_modules/ajv']?.version !== '8.20.0') throw new Error('Existing validator conflicts');
          lock.packages[''].devDependencies.ajv = '8.20.0';
          lock.packages = Object.fromEntries(Object.entries(lock.packages).sort(([a], [b]) => a < b ? -1 : a > b ? 1 : 0));
          const schema = JSON.parse(readFileSync('packages/catalog/schema/catalog-document.schema.json', 'utf8'));
          // Declare the array type in each conditional branch for strict Ajv.
          for (const branch of schema.anyOf) for (const rule of Object.values(branch.properties)) rule.type = 'array';
          // Unlike RegExp $, endsWith does not permit a terminal newline.
          for (const branch of schema.definitions.asset.allOf) {
            branch.then.properties.path.pattern = branch.then.properties.path.pattern.replace(/\$$/, '(?![\\s\\S])');
          }
          for (const [path, content] of [
            ['package-lock.json', JSON.stringify(lock, null, 2) + '\n'],
            ['packages/catalog/schema/catalog-document.schema.json', JSON.stringify(schema, null, 2) + '\n'],
          ]) {
            const response = await fetch('https://api.github.com/repos/atlasmechanica/atlasmechanica/git/blobs', {
              method: 'POST', headers: {Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json'},
              body: JSON.stringify({content, encoding: 'utf-8'}),
            });
            if (!response.ok) throw new Error(`Blob creation failed: ${response.status}`);
            console.log(JSON.stringify({path, sha: (await response.json()).sha}));
          }
          NODE
