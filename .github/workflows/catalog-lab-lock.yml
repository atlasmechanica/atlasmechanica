name: catalog lab workspace lock
on:
  push:
    branches: [feat/json-lab-presentations]
    paths: [.github/workflows/catalog-lab-lock.yml]
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Record existing lab workspace edge as an immutable lock blob
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          const pkg = JSON.parse(readFileSync('packages/catalog/package.json', 'utf8'));
          if (JSON.stringify(pkg.dependencies) !== JSON.stringify({'@atlasmechanica/lab': 'file:../lab', '@atlasmechanica/model': 'file:../model'})) throw new Error('Unexpected dependencies');
          if (lock.packages['node_modules/@atlasmechanica/lab']?.resolved !== 'packages/lab') throw new Error('Missing lab workspace');
          if (JSON.stringify(lock.packages['packages/catalog'].dependencies) !== JSON.stringify({'@atlasmechanica/model': 'file:../model'})) throw new Error('Unexpected catalog lock baseline');
          lock.packages['packages/catalog'].dependencies = pkg.dependencies;
          const response = await fetch('https://api.github.com/repos/atlasmechanica/atlasmechanica/git/blobs', {
            method: 'POST',
            headers: {Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json'},
            body: JSON.stringify({content: JSON.stringify(lock, null, 2) + '\n', encoding: 'utf-8'}),
          });
          if (!response.ok) throw new Error(`Blob creation failed: ${response.status}`);
          console.log(JSON.stringify({path: 'package-lock.json', sha: (await response.json()).sha}));
          NODE
